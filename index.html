<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px -apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>オハナ現場マニュアル</title><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#FBF5E6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="現場マニュアル"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* Layout: phone-first single column (max 600px). Sticky top bar holds the brand and one shared search box.
   Entrance = two doors (現場 / 社内). 現場 = role → scene → cards. 社内 = category → link rows. Bottom nav fixed. */
:root{
  /* 白・生成り・黒だけ。差し色は「止める」の赤1つ */
  --bg:#FBF5E6; --paper:#FFFFFF; --ink:#1B1A17; --muted:#6B655A; --line:#DED5C2;
  --green:#1B1A17; --green-ink:#FFFFFF; --green-soft:#F1E8D3;
  --wood:#1B1A17; --wood-soft:#F1E8D3;
  --amber:#1B1A17; --amber-soft:#F1E8D3;
  --blue:#6B655A; --blue-soft:#F7F2E6;
  --red:#B5382B; --red-soft:#F8E3DF;
  --shadow:0 1px 2px rgba(40,30,10,.06);
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161411; --paper:#1F1C17; --ink:#F1EBDD; --muted:#A89F8C; --line:#3A352C;
  --green:#F1EBDD; --green-ink:#1B1A17; --green-soft:#2A261F;
  --wood:#F1EBDD; --wood-soft:#2A261F;
  --amber:#F1EBDD; --amber-soft:#2A261F;
  --blue:#A89F8C; --blue-soft:#24211B;
  --red:#E88B80; --red-soft:#3E2320;
  --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#161411; --paper:#1F1C17; --ink:#F1EBDD; --muted:#A89F8C; --line:#3A352C;
  --green:#F1EBDD; --green-ink:#1B1A17; --green-soft:#2A261F;
  --wood:#F1EBDD; --wood-soft:#2A261F;
  --amber:#F1EBDD; --amber-soft:#2A261F;
  --blue:#A89F8C; --blue-soft:#24211B;
  --red:#E88B80; --red-soft:#3E2320;
  --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.large{font-size:18.5px}
a{color:var(--green)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar .in{max-width:600px;margin:0 auto;padding:10px 16px 10px;display:grid;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font-size:1.05em;color:var(--green);white-space:nowrap}
.brand h1 small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.72em;white-space:normal}
.brand .tag{font-size:.72em;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:999px;white-space:nowrap}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1em}
.searchrow input:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
.aa{flex:none;width:52px;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;font-family:var(--f-display);font-size:1em;cursor:pointer}
.aa[aria-pressed="true"]{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;display:grid;gap:18px}
.sec{display:grid;gap:8px}
.sec h2{font-size:1.1em;color:var(--green)}
.sec h2 .cnt{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.78em;margin-left:8px}
.sec p.sub{margin:0;color:var(--muted);font-size:.88em}
.muted{color:var(--muted);font-size:.86em}
.note{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:10px 14px;font-size:.88em}
.note b{color:var(--green)}
.warn{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:10px 14px;font-size:.88em}
.warn b{color:var(--amber)}
/* characters */
.host{display:flex;gap:14px;align-items:center}
.host .t{min-width:0;flex:1}
.host h2{white-space:nowrap}
.chara{flex:none;width:auto;max-width:40%;object-fit:contain}
.chara.h120{height:120px}.chara.h96{height:96px}.chara.h80{height:80px}
.emptybox{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:.92em}
.foot-chara{display:flex;justify-content:flex-end;align-items:flex-end;gap:10px;margin-top:4px}
.foot-chara span{font-size:.8em;color:var(--muted);text-align:right}
/* entrance doors */
.doors{display:grid;gap:12px}
.door{border:2px solid var(--green);border-radius:14px;padding:18px 16px;text-align:left;cursor:pointer;display:grid;gap:6px;min-height:104px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.door:hover{background:var(--green-soft)}
.door.office{border-color:var(--wood);border-width:1px;background:var(--green-soft)}
.door.office:hover{background:var(--wood-soft)}
.door .k{font-family:var(--f-display);font-size:1.45em;line-height:1.2;color:var(--green)}
.door.office .k{color:var(--wood)}
.door .s{font-size:.9em;color:var(--muted)}
.door .n{font-size:.78em;color:var(--muted);justify-self:start;border:1px solid var(--line);border-radius:999px;padding:1px 10px;margin-top:2px}
/* role grid / cats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.cat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:2px;min-height:64px;box-shadow:var(--shadow)}
.cat:hover{border-color:var(--green)}
.cat .k{font-family:var(--f-display);font-size:1.05em}
.cat .s{font-size:.8em;color:var(--muted)}
.cat .fix{font-size:.74em;color:var(--amber);justify-self:start;background:var(--amber-soft);border-radius:999px;padding:0 8px;margin-top:4px}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:10px 14px}
.who b{font-family:var(--f-display);color:var(--green);font-size:1.1em}
.who small{color:var(--muted);margin-left:6px}
/* scenes */
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{border:2px solid var(--green);border-radius:12px;padding:14px 12px;min-height:92px;text-align:left;cursor:pointer;background:var(--paper);color:var(--ink);display:grid;align-content:space-between;gap:6px;box-shadow:var(--shadow)}
.scene:hover{background:var(--green-soft)}
.scene .k{font-family:var(--f-display);font-size:1.2em;line-height:1.25;color:var(--green)}
.scene .s{font-size:.8em;color:var(--muted)}
.scene.danger{border-color:var(--red)}
.scene.danger .k{color:var(--red)}
.scene.danger:hover{background:var(--red-soft)}
.order{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.9em;display:grid;gap:6px}
.order b{color:var(--green);font-size:.85em}
.order ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.order li{border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.order li+li::before{content:"→";margin-right:6px;color:var(--muted)}
/* buttons */
.btn{border:1.5px solid var(--green);background:var(--paper);color:var(--green);border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:.92em;min-height:44px}
.btn.solid{background:var(--green-soft);color:var(--green)}
.btn.small{padding:7px 12px;min-height:40px;font-size:.86em}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.92em;min-height:44px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.chip:hover{border-color:var(--wood)}
/* item cards */
.list{display:grid;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-columns:6px 1fr}
.card .stripe{background:var(--line)}
.card.when-check .stripe{background:var(--ink)}
.card.when-stop .stripe{background:var(--red)}
.card.when-complete .stripe{background:var(--ink)}
.card .body{min-width:0}
.card-h{width:100%;border:0;background:none;text-align:left;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 10px;cursor:pointer;align-items:start}
.card-h .t{min-width:0}
.card-h .t b{display:block;font-size:1.02em;line-height:1.35}
.card-h .t .sum{display:block;color:var(--muted);font-size:.86em;margin-top:3px}
.pill{font-size:.72em;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;background:transparent;border:1px solid currentColor;color:var(--muted);align-self:start}
.when-check .pill{color:var(--ink)}
.when-stop .pill{color:var(--red);background:var(--red-soft)}
.when-complete .pill{color:var(--ink);border-style:double;border-width:3px}
.badge{display:inline-block;font-size:.7em;font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:middle}
.card-b{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:12px}
.blk h4{font-size:.92em;border-left:4px solid var(--green);padding-left:8px;margin-bottom:6px}
.blk ul{margin:0;padding-left:1.25em;font-size:.97em}
.blk li{margin:4px 0}
.blk li.new{background:var(--amber-soft);border-radius:4px;padding:1px 6px;margin-left:-6px}
.blk li.new::after{content:"追加案";font-size:.7em;color:var(--amber);font-weight:700;margin-left:6px}
.blk li.rule{font-weight:700}
.stopbox{display:grid;gap:2px;border:1.5px solid var(--red);border-left-width:5px;border-radius:8px;padding:8px 12px;font-size:.92em}
.stopbox b{color:var(--red);font-size:.9em}
.handoff{margin:0;font-size:.95em}
.blk li.rule::after{content:"必ず";background:var(--ink);color:var(--paper);font-size:.7em;border:1px solid var(--ink);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:700}
.rulebox{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.rulebox b{font-family:var(--f-display);font-size:1em}
.rulebox ol{margin:0;padding-left:1.4em;font-weight:700}
.rulebox li{margin:2px 0}
.rulebox .lnk{font-size:.85em;font-weight:400}
.ruleline{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;font-size:.9em;font-weight:700}
.ruleline .tag{font-size:.75em;border:1px solid var(--ink);border-radius:4px;padding:0 5px}
.zlist{display:grid;gap:8px;counter-reset:z}
.z{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:12px 14px 12px 50px;position:relative;display:grid;gap:2px}
.z::before{counter-increment:z;content:counter(z);position:absolute;left:14px;top:12px;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:.9em}
.z b{font-size:1.05em;line-height:1.4}
.ib{display:inline-block}
.z span{font-size:.86em;color:var(--muted)}
.z small{font-size:.76em;color:var(--muted)}
.readbtn{width:100%;border:2px solid var(--ink);background:var(--paper);border-radius:12px;padding:16px;font-family:var(--f-display);font-size:1.15em;cursor:pointer;min-height:56px}
.readbtn:hover{background:var(--green-soft)}
.pill.zp{color:var(--ink);border:2px solid var(--ink);font-size:.74em}
.card.zc{border-color:var(--ink);border-width:2px}
.pills{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.blk pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.9em;background:var(--bg);border-radius:8px;padding:10px 12px;border:1px solid var(--line)}
.more{border:1.5px dashed var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--green);font-weight:700;font-size:.9em;min-height:44px}
.card-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.8em;color:var(--muted)}
.fb{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.fb textarea{width:100%;min-height:140px;font:inherit;font-size:.9em;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink)}
.divider{font-size:.8em;font-weight:700;color:var(--muted);letter-spacing:.06em;padding:8px 2px 0;border-top:2px dashed var(--line);margin-top:6px}
.back{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);font-size:.92em;padding:8px 0}
.copymsg{font-size:.84em;color:var(--muted)}
/* office rows */
.lock{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--wood);border-radius:10px;padding:10px 14px;font-size:.88em}
.lock svg{flex:none;margin-top:3px}
.lock b{color:var(--wood)}
.cat.office{border-left:4px solid var(--wood)}
.cat.office .k{color:var(--wood)}
.rows{display:grid;gap:6px}
.rows h3{font-size:.88em;color:var(--muted);letter-spacing:.06em;padding:8px 2px 2px}
.rowlink{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 14px;text-decoration:none;color:var(--ink);min-height:48px}
.rowlink:hover{border-color:var(--wood)}
.rowlink .n{min-width:0;overflow-wrap:anywhere}
.rowlink .go{flex:none;font-size:.8em;color:var(--wood);font-weight:700}
button.rowlink{width:100%;font:inherit;cursor:pointer;text-align:left}
.doc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.doc h3{font-size:1em;margin-top:8px;border-left:4px solid var(--ink);padding-left:8px}
.doc p{margin:0;font-size:.95em;line-height:1.75;overflow-wrap:anywhere;border-bottom:1px dashed var(--line);padding-bottom:6px}
.doc p:last-child{border-bottom:0}
.rowlink .flag{flex:none;font-size:.72em;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:5px;padding:2px 6px}
.repgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.repbtn{border:2px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);padding:14px 12px;min-height:110px;text-align:left;cursor:pointer;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow)}
.repbtn:hover{background:var(--green-soft)}
.repbtn .k{font-family:var(--f-display);font-size:1.2em;line-height:1.25}
.repbtn .s{font-size:.8em;color:var(--muted)}
.repbtn .st{justify-self:start;font-size:.76em;border:1px solid var(--line);border-radius:999px;padding:0 9px;color:var(--muted);margin-top:4px}
.repbtn .st.done{border-color:var(--ink);color:var(--ink)}
.repbtn.due{border-width:4px;padding:12px 10px}
.repbtn.due .st{border-color:var(--ink);color:var(--ink);font-weight:700}
.repline{width:100%;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--paper);color:var(--ink);font:inherit;font-weight:700;text-align:left;cursor:pointer;min-height:48px}
.repline .tag{font-size:.75em;border:1px solid var(--ink);border-radius:4px;padding:0 5px}
.repline .go{margin-left:auto;font-size:.85em}
.repform{display:grid;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.rf[hidden]{display:none}
.repform label,.repform .fld{display:grid;gap:5px;font-size:.9em;font-weight:700}
.repform input[type=text],.repform input[type=number],.repform textarea{font:inherit;font-weight:400;font-size:1em;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.repform textarea{min-height:72px;resize:vertical}
.repform input:focus,.repform textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.req::after{content:"必須";font-size:.72em;border:1px solid var(--ink);border-radius:4px;padding:0 4px;margin-left:6px;font-weight:700}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:400;cursor:pointer;min-height:44px}
.radios input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.cklist{display:grid;gap:8px}
.ck{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.ck input{width:26px;height:26px;accent-color:var(--ink);margin:0}
.ck.on{border:2px solid var(--ink);padding:11.5px 13.5px}
.ck span{line-height:1.55}
.ck small{display:block;font-size:.74em;color:var(--muted);margin-top:2px}
.need{margin:0;font-size:.95em;font-weight:700}
.need.err{color:var(--red)}
.need.ok{border-left:4px solid var(--ink);padding-left:8px}
.repout{display:grid;gap:8px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:12px 14px}
.repout textarea{width:100%;min-height:210px;font:inherit;font-size:.95em;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink)}
.must{display:inline-block;background:var(--ink);color:var(--paper);font-size:.72em;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap;letter-spacing:.04em;vertical-align:middle}
.pill.must{border:1px solid var(--ink);color:var(--paper);background:var(--ink)}
.mic{flex:none;width:52px;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.mic[hidden]{display:none}
.mic.on{border-color:var(--red);color:var(--red)}
.recent{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.86em;color:var(--muted)}
.recent .chip{min-height:36px;padding:5px 12px;font-size:.9em}
.tip{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.88em;display:grid;gap:6px}
.tip b{font-family:var(--f-display)}
.tip .row{justify-content:flex-end}
.totop{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:6;width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--f-display);font-size:1.1em;cursor:pointer;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.totop.show{opacity:1;pointer-events:auto}

const nrm = s => String(s||"").normalize("NFKC").toLowerCase().replace(/[\u30a1-\u30f6]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s　・･\-ー〜~、。]/g,"");
const SYN = {"といれ":["便器","べんき"],"べんき":["トイレ"],"じゃぐち":["水栓"],"すいせん":["蛇口"],"ふすま":["襖"],"しょうじ":["障子"],"たたみ":["畳"],"かぎ":["鍵","キーボックス","シリンダー"],"きーぼっくす":["鍵"],"くろす":["壁紙","内装"],"かべがみ":["クロス"],"ゆか":["床","フロア"],"でんき":["電気","分電盤","ブレーカー","コンセント"],"ぶれーかー":["分電盤","漏電"],"あめもり":["雨漏り","雨染み","防水"],"しろあり":["白蟻","防蟻"],"ぼうぎ":["白蟻"],"きゅうとうき":["給湯器","リンナイ"],"がす":["ガス","プロパン"],"すいどう":["水道","給水","排水"],"はいすい":["排水桝","浄化槽"],"あしば":["足場","高所"],"しゃしん":["写真","撮影","カメラ"],"かえり":["帰る前","退場","戸締まり"],"とうちゃく":["到着","朝の挨拶","入場"],"じこ":["事故","破損","漏水"],"くるま":["駐車","車両"],"たばこ":["喫煙"],"ごみ":["廃材","残置物"],"まど":["サッシ","ガラス","網戸"],"どあ":["建具","玄関ドア"],"てんじょう":["天井"],"がいへき":["外壁","塗装"],"やね":["屋根","防水","板金"],"あつい":["熱中症","夏"],"あめ":["雨の日","台風"],"ちゅうしゃじょう":["駐車場","外構"],"わっと":["ワット","100形","ダウンライト"],"わっとすう":["100形","ダウンライト"],"だうんらいと":["ダウンライト","100形","150パイ"],"でんきゅう":["電球色","ダウンライト","100形"],"あかるさ":["100形","ルーメン","調光"],"るーめん":["lm","100形"],"ちょうこう":["調光","ダウンライト"],"ひゃくわっと":["100形","ダウンライト"],"ひゃくけい":["100形","ダウンライト"],"かみなり":["雷","雷ナウキャスト","屋外作業を中止"],"らいめい":["雷鳴","雷"],"ねつちゅうしょう":["熱中症","WBGT","暑さ"],"ねっちゅうしょう":["熱中症","WBGT","暑さ"],"だぶりゅびーじーてぃー":["WBGT","熱中症"],"すいあつ":["水圧","MPa","1.75","圧力計"],"あつりょくけい":["圧力計","水圧","MPa"],"まんすい":["満水","排水管"],"ぼうすい":["防水","水張り","散水"],"みずはり":["水張り","防水","水深20mm"],"さんすい":["散水","防水"],"きょようさ":["許容差","ズレ","±"],"ごさ":["許容差","±"],"ずれ":["許容差","±"],"ほばき":["巾木","NODA"],"かぜ":["風","風速","10m/s","強風"],"きょうふう":["強風","風速","10m/s"],"ふうそく":["風速","10m/s"],"うりょう":["雨量","10mm"],"ちゅうし":["中止","止める基準"],"ひんばん":["品番"],"かたばん":["品番","型番"],"きゃたつ":["脚立","高所"],"こうしょ":["高所","2m以上","墜落"],"ついらく":["墜落","高所","2m以上"],"じょうまえ":["錠前","鍵","刻印","数字とアルファベット"],"こくいん":["刻印","錠前","数字とアルファベット"],"かぎのばんごう":["鍵のナンバー","鍵番号","刻印"],"かぎばんごう":["鍵のナンバー","鍵番号","刻印"],"なんばー":["ナンバー","鍵のナンバー","刻印"],"どあくろーざー":["ドアクローザー","クローザー","ピッチ"],"くろーざー":["ドアクローザー","クローザー","ピッチ"],"ぴっち":["ピッチ","ドアクローザー","取付ピッチ"]};
function qTerms(t){ const n=nrm(t); const out=new Set([n]); const hit=Object.keys(SYN).filter(k=>n===k||n.includes(k)); for(const k of hit){ if(hit.some(o=>o!==k&&o.includes(k))) continue; SYN[k].forEach(x=>out.add(nrm(x))); } return [...out].filter(Boolean); }
/* 空白で区切った語は、全部あてはまるものだけ（AND）。1語ならこれまでどおり */
const qGroups = t => String(t).split(/[\s\u3000]+/).filter(w=>nrm(w)).map(qTerms);
const allG = (groups, txt) => groups.length>0 && groups.every(g=>g.some(q=>txt.includes(q)));
function itemScoreG(i, groups){ let sum=0; for(const g of groups){ const v=itemScore(i,g); if(!v) return 0; sum+=v; } return sum; }
function itemScore(i, terms){
  i._t ??= nrm(i.title); i._k ??= nrm((i.keywords||[]).join(" ")+" "+i.summary); i._b ??= nrm([...(i.actions||[]),...(i.checks||[]),...(i.notes||[]),...(i.actionsX||[]),...(i.checksX||[]),...(i.notesX||[]),i.stop||""].map(x=>typeof x==="string"?x:(x&&x.t)||"").join(" "));
  let best=0; for(const q of terms){ if(i._t.includes(q)) best=Math.max(best,3); else if(i._k.includes(q)) best=Math.max(best,2); else if(i._b.includes(q)) best=Math.max(best,1); }
  return best;
}
function renderSearch(term){
  const t = term.trim(); setNav(prevMode==="office"?"office":prevMode==="genba"?"genba":"home"); trackSearch(t);
  const nt = nrm(t); const groups = nt ? qGroups(t) : [];
  const hits = nt ? D.items.map(i=>({i,s:itemScoreG(i,groups)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.i) : [];
  const dhits = nt ? DOCS.filter(x=>{ x._n ??= nrm(docText(x)); return allG(groups, x._n); }) : [];
  const orows = nt ? D.office.cats.flatMap(c=>c.groups.flatMap(g=>g.items.filter(i=>allG(groups, nrm(i.n))).map(i=>({...i,cat:c.label})))) : [];
  const qrows = (nt && D.quick) ? D.quick.groups.flatMap(g=>g.rows).filter(r=>allG(groups, nrm(r.k+" "+r.v+" "+r.from))) : [];
  const crows = (nt && D.catalog) ? D.catalog.items.filter(r=>allG(groups, nrm([r.area,r.name,r.maker,r.model,r.spec].join(" ")))) : [];
  const recent = lsGet("ohana-recent-q",[]).filter(x=>x!==t);
  view.innerHTML = `
  <section class="sec"><h2>検索「${esc(t)}」</h2><p class="sub">${D.meta.edition==="genba" ? `${hits.length}件` : `現場 ${hits.length}件・社内の手引き ${dhits.length}件・リンク ${orows.length}件`}</p></section>
  <div class="back"><button class="btn small ghost" type="button" data-clear>← 検索をやめる</button></div>
  ${recent.length?`<div class="recent"><span>最近：</span>${recent.map(r=>`<button class="chip" type="button" data-q="${esc(r)}">${esc(r)}</button>`).join("")}</div>`:""}
  ${qrows.length?`<section class="sec"><h2>数値早見表<span class="cnt">${qrows.length}</span></h2></section><div class="qgroup">${qrows.map(quickRowHtml).join("")}</div>`:""}
  ${crows.length?`<section class="sec"><h2>品番・買うもの<span class="cnt">${crows.length}</span></h2></section><div class="qgroup">${crows.slice(0,8).map(catRowHtml).join("")}</div>`:""}
  ${hits.length?`<section class="sec"><h2>現場で使う<span class="cnt">${hits.length}</span></h2></section><div class="list">${hits.map(card).join("")}</div>`:""}
  ${dhits.length?`<section class="sec"><h2>社内の手引き（中身）<span class="cnt">${dhits.length}</span></h2></section><div class="rows">${dhits.map(x=>`<button class="rowlink" type="button" data-doc="${x.id}"><span class="n">${esc(x.name)}</span><span class="go">読む</span></button>`).join("")}</div>`:""}
  ${orows.length?`<section class="sec"><h2>社内のリンク<span class="cnt">${orows.length}</span></h2></section><div class="rows">${orows.map(i=>`<a class="rowlink" href="${D.meta.sheetUrl}" target="_blank" rel="noopener"><span class="n">${esc(i.n)}<span class="muted">　${esc(i.cat)}</span></span>${i.flag?`<span class="flag">${i.flag}</span>`:""}<span class="go">開く</span></a>`).join("")}</div>`:""}
  ${!hits.length&&!orows.length&&!dhits.length&&!qrows.length&&!crows.length?`<div class="emptybox"><img class="chara h96" src="img/akiyaking-07.png" alt="空き家王"><p class="empty">見つかりませんでした。ひらがなでも探せます（例：「じゃぐち」「かぎ」「あめもり」）。</p></div>`:""}`;
}

/* ---------- events ---------- */
function restore(){ if(prevMode==="office") renderOfficeTop(); else if(prevMode==="genba") renderGenbaTop(); else renderHome(); }
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-go],[data-role],[data-pick-role],[data-scene],[data-cat],[data-toggle],[data-more],[data-fb],[data-copy],[data-goto],[data-ocat],[data-clear],[data-zread],[data-zagain],[data-doc],[data-report],[data-make],[data-next],[data-recent],[data-q],[data-tipclose],[data-news],[data-quick],[data-openitem],[data-openitem-title],[data-qjump],[data-catalog],[data-cjump],[data-copytext]");
  if(!el) return;
  if(el.dataset.go){ q.value=""; const g=el.dataset.go; if(g==="genba") renderGenbaTop(); else if(g==="office") renderOfficeTop(); else renderHome(); }
  else if(el.dataset.role){ role=el.dataset.role; try{ localStorage.setItem("ohana-role", role); }catch(x){} if(zettaiRead()) renderGenbaTop(); else renderZettai(); }
  else if(el.hasAttribute("data-zread")){ markZettaiRead(); renderGenbaTop(); }
  else if(el.hasAttribute("data-zagain")){ renderZettai({again:true}); }
  else if(el.hasAttribute("data-pick-role")){ renderRolePicker(); }
  else if(el.dataset.scene){ const s=SCENES.find(x=>x.id===el.dataset.scene); const {own,com}=sceneIds(s.id); renderList(`${role}：${s.k}`, s.s, own, com, "genba", {rule:true, report: s.id==="A"?"arrive":(s.id==="C"?"leave":null)}); go("genba"); }
  else if(el.dataset.cat){ const c=el.dataset.cat; renderList(c==="全員共通"||c==="安全・季節"?c:`${c}の項目`, "場面に関係なく全部", catIds(c), [], "genba"); go("genba"); }
  else if(el.dataset.ocat){ renderOfficeCat(el.dataset.ocat); go("office"); }
  else if(el.dataset.report){ q.value=""; renderReport(el.dataset.report); }
  else if(el.dataset.make){ makeReport(el.dataset.make); }
  else if(el.dataset.next){ const n=document.getElementById("r-next"); if(n){ n.value=el.dataset.next; updateNeed(repKind); } }
  else if(el.dataset.doc){ q.value=""; renderOfficeDoc(el.dataset.doc); go("office"); }
  else if(el.hasAttribute("data-news")){ renderNews(); }
  else if(el.hasAttribute("data-quick")){ renderQuick(); }
  else if(el.hasAttribute("data-catalog")){ renderCatalog(); }
  else if(el.dataset.cjump!==undefined){ const g=document.getElementById("cg-"+el.dataset.cjump); if(g) g.scrollIntoView({block:"start"}); }
  else if(el.dataset.copytext){ const v=el.dataset.copytext; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>{ el.textContent="コピーしました"; setTimeout(()=>{el.textContent="品番をコピー";},1500); }).catch(()=>{ window.prompt("品番", v); }); }
  else if(el.dataset.qjump!==undefined){ const g=document.getElementById("qg-"+el.dataset.qjump); if(g) g.scrollIntoView({block:"start"}); }
  else if(el.dataset.openitem){ openItem(el.dataset.openitem); }
  else if(el.dataset.openitemTitle){ const it=D.items.find(x=>x.title===el.dataset.openitemTitle); if(it) openItem(it.id); }
  else if(el.dataset.recent){ const ids=lsGet("ohana-recent",[]); opened.add(el.dataset.recent); renderList("最近見た項目","この端末で最近開いたもの", ids, [], "genba"); }
  else if(el.dataset.q!==undefined){ q.value=el.dataset.q; renderSearch(el.dataset.q); }
  else if(el.hasAttribute("data-tipclose")){ lsSet("ohana-tip-home", true); el.closest(".tip").remove(); }
  else if(el.dataset.toggle){ const id=el.dataset.toggle; opened.has(id)?opened.delete(id):opened.add(id); if(opened.has(id)){ pushRecentItem(id); if(history.state&&history.state.v==="search") pushRecentSearch(q.value); } const art=document.getElementById("c-"+id); art.outerHTML=card(byId[id]); if(opened.has(id)) document.getElementById("c-"+id).scrollIntoView({block:"nearest"}); }
  else if(el.dataset.more){ const box=document.getElementById("more-"+el.dataset.more); box.hidden=false; el.hidden=true; }
  else if(el.dataset.fb){ const box=document.getElementById("fb-"+el.dataset.fb); box.hidden=!box.hidden; syncLineLinks(); }
  else if(el.dataset.copy){ const src=document.getElementById(el.dataset.copy); const msg=document.getElementById("msg-"+el.dataset.copy); const text=src.value!==undefined?src.value:src.textContent;
    navigator.clipboard.writeText(text).then(()=>{ if(msg) msg.textContent="コピーしました。"+pasteHint(); }).catch(()=>{ if(src.select){ src.select(); } else { const r=document.createRange(); r.selectNodeContents(src); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} if(msg) msg.textContent="選択しました。長押しでコピーしてください"; }); }
  else if(el.dataset.goto){ e.preventDefault(); opened.add("photo-std"); renderList("写真の撮り方（共通基準）","全項目が参照する1本", ["photo-std"], [], "genba"); }
  else if(el.hasAttribute("data-clear")){ q.value=""; restore(); }
});
function syncLineLinks(){ document.querySelectorAll("[data-line-for]").forEach(a=>{ const ta=document.getElementById(a.dataset.lineFor); if(ta) a.href=lineShareUrl(ta.value); }); }
document.addEventListener("input", e=>{ if(e.target.tagName==="TEXTAREA" && document.querySelector(`[data-line-for="${e.target.id}"]`)) syncLineLinks(); });
q.addEventListener("input", ()=>{ if(q.value.trim()) renderSearch(q.value); else restore(); });
q.addEventListener("keydown", e=>{ if(e.key==="Enter"){ pushRecentSearch(q.value); q.blur(); } });
/* 声で探す（使える端末だけ。試作の画面では使えないことがある） */
(()=>{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const b=document.getElementById("mic"); if(!SR||!b) return; b.hidden=false; let rec=null;
  b.addEventListener("click", ()=>{ if(rec){ try{rec.stop();}catch(e){} return; } try{ rec=new SR(); }catch(e){ b.hidden=true; return; }
    rec.lang="ja-JP"; rec.interimResults=false; rec.maxAlternatives=1; b.classList.add("on"); q.placeholder="話してください…";
    rec.onresult=ev=>{ const t=ev.results[0][0].transcript||""; q.value=t; renderSearch(t); pushRecentSearch(t); };
    rec.onerror=ev=>{ q.placeholder="声は使えませんでした。文字で探してください"; if(ev.error==="not-allowed"||ev.error==="service-not-allowed") b.hidden=true; };
    rec.onend=()=>{ rec=null; b.classList.remove("on"); setTimeout(()=>{ q.placeholder="探す（例：水栓、鍵、お礼状）"; },2500); };
    try{ rec.start(); }catch(e){ rec=null; b.classList.remove("on"); b.hidden=true; } }); })();
/* 新しい内容の案内：本番（ホーム画面に入れられる版）だけ。開き直した時と10分ごとに版を確かめる */
(()=>{ if(!document.querySelector('link[rel="manifest"]')) return; const bar=document.getElementById("newver"), go=document.getElementById("newver-go"), cur=(D.meta||{}).build; if(!bar||!cur) return;
  const check=()=>{ fetch("version.json?_="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.v&&j.v!==cur) bar.hidden=false; }).catch(()=>{}); };
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") check(); });
  go.addEventListener("click",()=>{ try{ navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.update())); }catch(e){} location.reload(); });
  setInterval(check, 600000); setTimeout(check, 3000); })();
/* いちばん上へ */
(()=>{ const t=document.getElementById("totop"); if(!t) return; window.addEventListener("scroll", ()=>{ t.classList.toggle("show", window.scrollY>600); }, {passive:true}); t.addEventListener("click", ()=>window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})); })();
document.getElementById("aa").addEventListener("click", ()=>{ large=!large; try{ localStorage.setItem("ohana-large", large?"1":"0"); }catch(e){} applyLarge(); });
document.getElementById("nav-home").addEventListener("click", ()=>{ q.value=""; renderHome(); });
document.getElementById("nav-genba").addEventListener("click", ()=>{ q.value=""; renderGenbaTop(); });
document.getElementById("nav-office").addEventListener("click", ()=>{ q.value=""; renderOfficeTop(); });
applyLarge();
if(D.meta.edition==="genba"){
  for(const id of ["nav-home","nav-office"]){ const b=document.getElementById(id); if(b) b.hidden=true; }
  const g=document.querySelector(".nav .in"); if(g) g.style.gridTemplateColumns="1fr";
  const tg=document.querySelector(".brand .tag"); if(tg){ const tx=(D.meta.tag===undefined?"試用版":D.meta.tag); if(tx) tg.textContent=tx; else tg.hidden=true; }
  const sb=document.getElementById("q"); if(sb) sb.placeholder="探す（例：水栓、鍵、床）";
}
const h = (location.hash||"").replace("#","");
if(h==="genba") renderGenbaTop(); else if(h==="office") renderOfficeTop(); else renderHome();
